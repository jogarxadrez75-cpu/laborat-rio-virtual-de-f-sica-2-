<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simuladores de Física</title>
<style>
:root{--bg:#ffe9a8;--ink:#2b2d42;--card:#fffdf5;--acc:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1838;--ink:#f6f1de;--card:#2a2656}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
main{max-width:720px;margin:auto}
h1{font-size:clamp(24px,5vw,34px);margin:8px 0}
p{line-height:1.5}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:14px 16px;margin:16px 0}
.card h2{margin:0 0 4px;font-size:20px}
.card span{font-size:15px;opacity:.85}
footer{font-size:13px;opacity:.7;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>🔬 Simuladores de Física</h1>
<p>Ferramentas interativas para ver a física acontecendo. Toque num simulador para abrir.</p>
<a class="card" href="cargas.html"><h2>⚡ Laboratório de Cargas</h2><span>Campo elétrico, potencial, força sobre uma carga de prova e circuitos simples.</span></a>
<footer>Projeto de extensão universitária.</footer>
</main>
</body>
</html>
